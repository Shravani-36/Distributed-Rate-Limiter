events {}

http {
    # Round-robin across the three API instances, so consecutive requests
    # from the same client land on different servers. The rate limit still
    # holds, because all three share one Redis.
    upstream api_backend {
        server api1:8000;
        server api2:8000;
        server api3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Don't retry a 429 on the next instance - that would hand the
            # client a second chance at a limit it already used up.
            proxy_next_upstream error timeout;
        }
    }
}
