services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Three identical API instances. They only agree on a limit because they
  # share the Redis above - that is the whole point of the project.
  api1: &api
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT: "10"
      WINDOW_SECONDS: "60"
      ALGORITHM: sliding
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api2: *api
  api3: *api

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped
